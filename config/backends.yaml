# Backend Definitions — runtime configuration per backend type
# Used by switch-model.sh to generate the correct command line.

backends:
  llama.cpp:
    dockerfile: Dockerfile.llama
    entrypoint: llama-server-mainline
    default_port: 10500
    default_threads: 16
    default_batch: 8192
    flash_attention: "on"
    neural_layers: 99
    default_sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 1.5
      repeat_penalty: 1.0
    env:
      GGML_CUDA_ENABLE_PEER_COPY: "1"

  vllm:
    dockerfile: Dockerfile.llama
    entrypoint: llama-server-mainline
    default_port: 10500
    command_prefix: serve
    default_gpu_memory_utilization: 0.85
    default_max_num_seqs: 4
    default_max_batched_tokens: 4096
    kv_cache_dtype: fp8
    env:
      VLLM_ATTENTION_BACKEND: triton_attn
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

  llama-swap:
    image: "${REGISTRY:-ghcr.io/mostlygeek}/llama-swap:latest"
    entrypoint: llama-server-mainline
    default_port: 9292

  webui:
    image: ghcr.io/open-webui/open-webui:main
    default_port: null
