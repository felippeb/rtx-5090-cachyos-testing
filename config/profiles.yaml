# Profile Definitions — service groupings for docker-compose --profile
# Maps to the profiles array in docker-compose.yml.

profiles:
  llama:
    description: "All llama.cpp inference services"
    compose_profile: llama

  llama-mtp:
    description: "llama.cpp services with MTP speculative decoding"
    compose_profile: llama-mtp

  vllm:
    description: "All vLLM inference services"
    compose_profile: vllm

  router:
    description: "Model router service"
    compose_profile: router

  swap:
    description: "llama-swap proxy service"
    compose_profile: swap

  webui:
    description: "Open WebUI frontend"
    compose_profile: webui

  infra:
    description: "All infrastructure services (router, swap, webui)"
    compose_profile: infra

  all:
    description: "Every service (use with caution — single GPU, mutual exclusion)"
    compose_profile: all
