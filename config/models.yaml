# Model Registry — declarative model definitions
# The switch-model.sh script reads this file to resolve model names.
#
# Fields:
#   display_name:    Human-readable name
#   aliases:         Short names for CLI switching
#   server_args:     Arguments passed to llama-server.
#                    {models_dir} and {config_dir} are substituted.
#   hf_repo:         HuggingFace repo (org/name) for auto-download
#   filename:        GGUF filename in the HF repo
#   mmproj_filename: mmproj filename (if vision/multimodal model)
#   mmproj_hf_repo:  Separate HF repo for mmproj (defaults to hf_repo)

models:
  # ─── Qwen3.8-27B NVFP4+MTP (daily driver) ─────────────────────
  qwen3.8-27b-nvfp4-mtp-131k:
    display_name: "Qwen3.8-27B NVFP4-MTP (131K)"
    aliases: [qwen38, nvfp4, nvfp4-mtp]
    model_dir: qwen3.8-27b-nvfp4-mtp
    hf_repo: null
    filename: qwen3.8-27b-text-nvfp4-mtp.gguf
    mmproj_filename: mmproj-F16.gguf
    mmproj_hf_repo: unsloth/Qwen3.8-27B-GGUF
    server_args: >-
      -m {models_dir}/qwen3.8-27b-nvfp4-mtp/qwen3.8-27b-text-nvfp4-mtp.gguf
      --mmproj {models_dir}/qwen3.8-27b-nvfp4-mtp/mmproj-F16.gguf
      -fitt 8192 -c 131072 -n 65536 -fa on -ngl 99 -np 1 -t 16 -tb 16
      -ctk bf16 -ctv bf16 -ctkd q4_1 -ctvd q4_1 -ctxcp 16 -cram 8192
      --cache-idle-slots --no-warmup
      --spec-type draft-mtp --spec-draft-n-max 2
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --presence-penalty 0.0 --repeat-penalty 1.0
      --jinja --chat-template-file {config_dir}/chat_template.jinja
      --reasoning on --reasoning-format deepseek --reasoning-budget 4096
      --reasoning-budget-message "I have reached my reasoning budget. I will now provide my final answer or take the most appropriate action based on my analysis so far."
      --chat-template-kwargs '{"reasoning_effort":"xhigh"}'
      --host 0.0.0.0 --port 10500

