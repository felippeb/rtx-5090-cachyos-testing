# Pre-commit hooks for local validation
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']
        # Exclude test scripts that intentionally have quirks
        exclude: |
          (?x)^(
            llama/setup-unsloth-studio\.sh|  # deprecated
            llama/setup-qwen36-27b-mtp\.sh|  # deprecated
            llama/setup-qwen36-35b-mtp\.sh|  # deprecated
            llama/setup-qwen36-mtp\.sh       # deprecated
          )$

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.13.0
    hooks:
      - id: markdownlint-cli2
        args: ['--fix']
        types_or: [markdown]

  # Python linting (ruff — fast, modern)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ['--fix', '--select=E,F,W,I']
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # JSON validation
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [json, yaml]
        exclude: |
          (?x)^(
            opencode/opencode\.json\.tlp|  # template with comments
            benchmarks/.*\.md              # markdown files
          )$
